services:
  weather-lb:
    image: nginx:1.30.2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - weather-api-1
      - weather-api-2
      - weather-api-3

  weather-api-1:
    build: ./api
    image: weather-sensors-api
    environment:
      - INSTANCE_NAME=API-1
    ports:
      - "3001:3000"

  weather-api-2:
    build: ./api
    image: weather-sensors-api
    environment:
      - INSTANCE_NAME=API-2
    ports:
      - "3002:3000"

  weather-api-3:
    build: ./api
    image: weather-sensors-api
    environment:
      - INSTANCE_NAME=API-3
    ports:
      - "3003:3000"